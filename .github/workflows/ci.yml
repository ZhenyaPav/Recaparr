name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recaparr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image tools and database
        run: |
          docker run --rm recaparr:test ./node_modules/.bin/summarize --version
          docker run --rm recaparr:test ffprobe -version
          docker run --rm recaparr:test node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('select 1').get(); db.close()"
      - name: Smoke-test service health
        run: |
          docker run -d --name recaparr-smoke -p 127.0.0.1:18082:8080 \
            -e RECAPARR_API_TOKEN=test-token \
            -e RECAPARR_LLM_API_KEY=test-key \
            -e JELLYFIN_API_KEY=test-jellyfin \
            recaparr:test
          trap 'docker rm -f recaparr-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18082/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs recaparr-smoke
          exit 1
